#!/usr/sbin/nft -f
# /etc/nftables.conf - firewall do servidor (IPv4 e IPv6).
# Só a rede de casa e a VPN (Tailscale) alcançam os serviços; da internet, nada entra.
# O servidor tem IPv6 público da Vivo, por isso a família inet.

# ATENCAO: flush ruleset apaga as regras do Docker. Depois de aplicar: systemctl restart docker.
flush ruleset

define LAN4 = 192.168.15.0/24
define LAN6 = fe80::/10

table inet filter {
    set servicos_tcp {
        type inet_service
        # SSH, impressao, CUPS/AirPrint, painel do AdGuard, DNS
        elements = { 22, 80, 631, 3000, 53 }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        # ICMP e ICMPv6 (o IPv6 não funciona sem neighbor discovery)
        meta l4proto icmp accept
        meta l4proto ipv6-icmp accept

        # Cliente DHCP / DHCPv6
        udp dport 68 accept
        udp dport 546 accept

        # mDNS: AirPrint e nomes .local
        udp dport 5353 accept

        # Tailscale: conexões diretas entre aparelhos
        udp dport 41641 accept

        # Serviços: só da LAN e da VPN
        ip saddr $LAN4 tcp dport @servicos_tcp accept
        ip6 saddr $LAN6 tcp dport @servicos_tcp accept
        ip saddr $LAN4 udp dport 53 accept
        ip6 saddr $LAN6 udp dport 53 accept
        iifname "tailscale0" tcp dport @servicos_tcp accept
        iifname "tailscale0" udp dport 53 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        # VPN -> rede de casa (Tailscale como subnet router)
        iifname "tailscale0" oifname "eno1" accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# Clientes da VPN saem para a LAN com o IP do servidor (respostas voltam por ele).
table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        iifname "tailscale0" oifname "eno1" masquerade
    }
}
